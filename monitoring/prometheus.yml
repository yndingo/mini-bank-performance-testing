global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: mini-bank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: jmeter
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "172.18.0.1:9271"
  - job_name: cadvisor
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080

