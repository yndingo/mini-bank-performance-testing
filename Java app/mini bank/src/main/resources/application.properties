spring.application.name=mini bank

spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/minibank?currentSchema=bank
spring.datasource.username=minibank_app
spring.datasource.password=${MINIBANK_DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=bank
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.address=127.0.0.1
server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.registration.demo-sms-enabled=true

app.auth.demo-sms-enabled=true

# ??????? ??????????. ?? ???????? ??? ?????????? ????.
app.demo-deposit-enabled=true